<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atemschutzüberwachung · FwDV 7</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d7263d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atemschutz">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg: #12161a;
    --bg-panel: #191f24;
    --bg-card: #1e252b;
    --line: #2b333a;
    --text: #eef1f3;
    --text-dim: #8d9aa5;
    --fire: #d7263d;
    --fire-dark: #a01d2e;
    --ok: #2f8f46;
    --ok-glow: #3fb85c;
    --warn: #e0a72e;
    --warn-glow: #f2bd45;
    --danger: #e53946;
    --danger-glow: #ff5a63;
    --rueckzug: #7a3ab0;
    --rueckzug-glow: #9b5cd6;
    --idle: #4b5760;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Top bar ---------- */
  header{
    background: linear-gradient(180deg, var(--bg-panel), var(--bg));
    border-bottom: 3px solid var(--fire);
    padding: 10px 16px 12px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px;
    position: sticky;
    top:0;
    z-index: 20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-right:auto;
  }
  .brand img{
    height: 46px;
    width: auto;
    display:block;
  }
  .brand .titles{
    display:flex;
    flex-direction:column;
  }
  .brand .mark{
    font-weight:900;
    letter-spacing:0.5px;
    font-size:19px;
    color:var(--text);
    text-transform:uppercase;
  }
  .brand .mark span{ color: var(--fire); }
  .brand .sub{
    font-size:11px;
    color: var(--text-dim);
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  input.einsatz{
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    width: 220px;
    max-width: 40vw;
  }
  input.einsatz:focus{ outline: 2px solid var(--fire); outline-offset:1px; }

  .clock{
    font-family: var(--mono);
    font-size: 30px;
    font-weight:700;
    letter-spacing: 1px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 14px;
    line-height:1.1;
  }
  .clock .date{
    display:block;
    font-family: var(--sans);
    font-size:10px;
    color: var(--text-dim);
    font-weight:600;
    letter-spacing:1px;
    text-align:center;
  }

  .settings{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .field label{
    font-size:10px;
    color: var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .field input[type=number]{
    width: 64px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size:14px;
  }

  button{
    font-family: var(--sans);
    cursor: pointer;
    border: none;
  }
  .icon-btn{
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .icon-btn:hover{ border-color: var(--fire); }
  .icon-btn.active{ background: var(--fire); border-color: var(--fire); }

  /* ---------- Main grid ---------- */
  main{
    padding: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    padding: 4px 4px 16px;
    font-size:12px;
    color: var(--text-dim);
  }
  .legend .dot{
    display:inline-block;
    width:9px; height:9px;
    border-radius:50%;
    margin-right:6px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--idle);
    border-radius: 10px;
    padding: 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition: border-color .25s, box-shadow .25s;
  }
  .card.ok{ border-left-color: var(--ok); }
  .card.warn{ border-left-color: var(--warn); }
  .card.danger{
    border-left-color: var(--danger);
    box-shadow: 0 0 0 1px rgba(229,57,70,0.35), 0 0 18px rgba(229,57,70,0.25);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .card.rueckzug{
    border-left-color: var(--rueckzug);
    box-shadow: 0 0 0 1px rgba(122,58,176,0.4), 0 0 18px rgba(122,58,176,0.3);
  }
  .card.ended{ opacity: 0.5; }

  .card.add-tile{
    align-items:center;
    justify-content:center;
    min-height: 280px;
    border: 2px dashed var(--line);
    background: transparent;
    padding: 0;
  }
  .card.add-tile:hover{ border-color: var(--fire); }
  .add-trupp-btn{
    background:transparent;
    border:none;
    color: var(--text-dim);
    width:100%;
    height:100%;
    min-height: 280px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
  }
  .add-trupp-btn .add-plus{
    font-size:64px;
    font-weight:300;
    line-height:1;
  }
  .add-trupp-btn .add-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
  }
  .add-trupp-btn:hover{ color: var(--fire); }
  .add-trupp-btn:hover .add-plus{ color: var(--fire); }

  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 1px rgba(229,57,70,0.35), 0 0 18px rgba(229,57,70,0.25); }
    50%{ box-shadow: 0 0 0 1px rgba(229,57,70,0.6), 0 0 28px rgba(229,57,70,0.5); }
  }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .trupp-name{
    color: var(--text);
    font-size:16px;
    font-weight:800;
    letter-spacing:0.3px;
    padding:2px 0;
  }

  .feuerwehr-field{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .feuerwehr-field label{
    font-size:10px;
    color: var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .feuerwehr-field input{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius:6px;
    padding:6px 8px;
    font-size:12.5px;
  }

  .badge{
    font-size:10.5px;
    font-weight:800;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding: 4px 8px;
    border-radius: 20px;
    white-space:nowrap;
    color:#0f1114;
    background: var(--idle);
  }
  .badge.ok{ background: var(--ok-glow); }
  .badge.warn{ background: var(--warn-glow); }
  .badge.danger{ background: var(--danger-glow); color:#2a0507;}
  .badge.rueckzug{ background: var(--rueckzug-glow); color:#fff; }
  .badge.ended{ background: var(--idle); color:#dfe4e7; }

  .timer{
    font-family: var(--mono);
    font-size: 34px;
    font-weight:700;
    text-align:center;
    letter-spacing:1px;
    padding: 4px 0;
  }
  .timer-label{
    text-align:center;
    font-size:10px;
    color: var(--text-dim);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-top:-8px;
  }

  .meta{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .pressure{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color: var(--text-dim);
  }
  .pressure input{
    flex:1;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius:6px;
    padding:6px 8px;
    font-family: var(--mono);
    font-size:13px;
  }
  .pressure input.low{
    border-color: var(--rueckzug);
    color: var(--rueckzug-glow);
    font-weight:700;
  }
  .members{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .members label{
    font-size:10px;
    color: var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.5px;
    display:block;
    margin-bottom:2px;
  }
  .members .name-rows{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .members input{
    width:100%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius:6px;
    padding:6px 8px;
    font-size:12.5px;
  }
  .members input.filled{
    border-color: #3a4551;
  }
  .start-hint{
    font-size:10px;
    color: var(--text-dim);
    text-align:center;
    margin-top:-4px;
  }

  .btn-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:6px;
  }
  .btn-row button{
    border-radius:6px;
    padding: 10px 6px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.3px;
    color: var(--text);
    background: var(--bg-panel);
    border: 1px solid var(--line);
  }
  .btn-row button:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-row button.start{ background: var(--ok); border-color: var(--ok); }
  .btn-row button.rueckmeldung{ background: #2c5f8a; border-color:#2c5f8a; }
  .btn-row button.rueckzug-btn{ background: var(--rueckzug); border-color: var(--rueckzug); }
  .btn-row button.ende{ background: var(--fire-dark); border-color: var(--fire-dark); }
  .btn-row button:not(:disabled):hover{ filter: brightness(1.15); }

  /* ---------- Log panel ---------- */
  .log-wrap{
    margin-top:22px;
    background: var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .log-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 10px 14px;
    border-bottom:1px solid var(--line);
  }
  .log-head h2{
    margin:0;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color: var(--text-dim);
  }
  .log-body{
    max-height: 260px;
    overflow-y:auto;
    font-family: var(--mono);
    font-size:12.5px;
  }
  .log-row{
    display:grid;
    grid-template-columns: 80px 120px 1fr;
    gap:10px;
    padding: 6px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .log-row:nth-child(odd){ background: rgba(255,255,255,0.015); }
  .log-row .t{ color: var(--text-dim); }
  .log-row .trupp{ color: var(--fire); font-weight:700; }
  .log-empty{ padding: 18px 14px; color: var(--text-dim); font-size:13px; }

  footer{
    text-align:center;
    color: var(--text-dim);
    font-size:11px;
    padding: 20px 10px 30px;
  }

  @media (max-width: 640px){
    .clock{ font-size:22px; }
    .grid{ grid-template-columns: 1fr 1fr; }
    .btn-row{ grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 420px){
    .grid{ grid-template-columns: 1fr; }
  }
</style>
</head>

<main>
  <div class="legend">
    <span><span class="dot" style="background:var(--idle)"></span>Bereit</span>
    <span><span class="dot" style="background:var(--ok-glow)"></span>OK</span>
    <span><span class="dot" style="background:var(--warn-glow)"></span>Bald fällig</span>
    <span><span class="dot" style="background:var(--danger-glow)"></span>Abfrage fällig</span>
    <span><span class="dot" style="background:var(--rueckzug-glow)"></span>Rückzug</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="log-wrap">
    <div class="log-head">
      <h2>Einsatzprotokoll</h2>
      <span id="logCount" style="color:var(--text-dim); font-size:11px;">0 Einträge</span>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-empty">Noch keine Einträge.</div>
    </div>
  </div>

  <footer>Lokale, eigenständige Anwendung · keine Serververbindung · Stand der Daten geht bei Neuladen der Seite verloren</footer>
</main>

<script>
(function(){
  let addTileEl = null;
  const STORAGE_KEY = 'atemschutz_fwdv7_state_v1';
  const trupps = [];
  const logEntries = [];
  let soundOn = true;

  const grid = document.getElementById('grid');
  const clockEl = document.getElementById('clock');
  const dateLine = document.getElementById('dateLine');
  const intervalInput = document.getElementById('intervalMin');
  const warnPctInput = document.getElementById('warnPct');
  const soundToggle = document.getElementById('soundToggle');
  const exportBtn = document.getElementById('exportBtn');
  const resetBtn = document.getElementById('resetBtn');
  const logBody = document.getElementById('logBody');
  const logCount = document.getElementById('logCount');

  function fmtClock(d){
    return d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  function fmtDate(d){
    return d.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'});
  }
  function fmtMMSS(totalSeconds){
    const sign = totalSeconds < 0 ? '-' : '';
    const s = Math.abs(Math.round(totalSeconds));
    const m = Math.floor(s/60);
    const sec = s%60;
    return sign + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function beep(freq, dur){
    try{
      const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    }catch(e){}
  }
  function alertSound(){
    if(!soundOn) return;
    beep(880, 0.35);
    setTimeout(()=>beep(660, 0.35), 400);
    setTimeout(()=>beep(880, 0.5), 800);
    setTimeout(()=>beep(660, 0.6), 1300);
  }

  function addLog(truppName, event, detail){
    const now = new Date();
    logEntries.unshift({time: fmtClock(now), trupp: truppName, event, detail: detail || ''});
    renderLog();
  }

  function renderLog(){
    logCount.textContent = logEntries.length + ' Einträge';
    if(logEntries.length === 0){
      logBody.innerHTML = '<div class="log-empty">Noch keine Einträge.</div>';
      return;
    }
    logBody.innerHTML = logEntries.map(e =>
      '<div class="log-row"><span class="t">' + e.time + '</span><span class="trupp">' + escapeHtml(e.trupp) +
      '</span><span>' + escapeHtml(e.event) + (e.detail ? ' — ' + escapeHtml(e.detail) : '') + '</span></div>'
    ).join('');
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function createTrupp(index){
    const t = {
      id: index,
      name: 'Trupp ' + index,
      state: 'idle',        // idle | active | ended
      rueckzugManual: false,
      pressureWarning: false,
      startTime: null,
      lastCheck: null,
      pressure: '',
      lastAlertAt: null,
      pressureAlerted: false
    };
    trupps.push(t);
    return t;
  }

  function buildCard(t){
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + t.id;
    card.innerHTML =
      '<div class="card-top">' +
        '<div class="trupp-name" id="name-' + t.id + '">' + escapeHtml(t.name) + '</div>' +
        '<span class="badge" id="badge-' + t.id + '">Bereit</span>' +
      '</div>' +
      '<div class="feuerwehr-field">' +
        '<label>Feuerwehr</label>' +
        '<input type="text" id="feuerwehr-' + t.id + '" placeholder="z.B. FF Tengling" />' +
      '</div>' +
      '<div class="members">' +
        '<label>Truppmitglieder (mind. 2 für Start)</label>' +
        '<div class="name-rows">' +
          '<input type="text" id="member-' + t.id + '-1" placeholder="Name 1 (z.B. Truppführer/in)" />' +
          '<input type="text" id="member-' + t.id + '-2" placeholder="Name 2" />' +
          '<input type="text" id="member-' + t.id + '-3" placeholder="Name 3 (optional)" />' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div class="timer" id="timer-' + t.id + '">--:--</div>' +
        '<div class="timer-label" id="timerLabel-' + t.id + '">bis zur Abfrage</div>' +
      '</div>' +
      '<div class="meta">' +
        '<span>Start: <span id="startedAt-' + t.id + '">–</span></span>' +
        '<span>Letzte Meldung: <span id="lastAt-' + t.id + '">–</span></span>' +
      '</div>' +
      '<div class="pressure">' +
        '<span>Flaschendruck (bar)</span>' +
        '<input type="number" min="0" max="400" id="pressure-' + t.id + '" placeholder="z.B. 180" />' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="start" id="start-' + t.id + '">Start</button>' +
        '<button class="rueckmeldung" id="ruckmeld-' + t.id + '" disabled>Rückmeldung</button>' +
        '<button class="rueckzug-btn" id="ruckzug-' + t.id + '" disabled>Rückzug</button>' +
        '<button class="ende" id="ende-' + t.id + '" disabled>Ende</button>' +
      '</div>';
    if(addTileEl){ grid.insertBefore(card, addTileEl); } else { grid.appendChild(card); }

    document.getElementById('feuerwehr-' + t.id).addEventListener('change', saveState);

    function refreshStartButton(){
      const ids = ['member-' + t.id + '-1', 'member-' + t.id + '-2', 'member-' + t.id + '-3'];
      let filled = 0;
      ids.forEach(id => {
        const el = document.getElementById(id);
        const has = el.value.trim().length > 0;
        el.classList.toggle('filled', has);
        if(has) filled++;
      });
      const startBtn = document.getElementById('start-' + t.id);
      if(t.state !== 'active'){
        startBtn.disabled = filled < 2;
      }
    }
    t.refreshStartButton = refreshStartButton;

    ['member-' + t.id + '-1', 'member-' + t.id + '-2', 'member-' + t.id + '-3'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', refreshStartButton);
      el.addEventListener('change', saveState);
    });
    refreshStartButton();

    document.getElementById('start-' + t.id).addEventListener('click', () => {
      t.state = 'active';
      t.rueckzugManual = false;
      t.pressureWarning = false;
      t.pressureAlerted = false;
      t.startTime = new Date();
      t.lastCheck = new Date();
      t.alerted = false;
      t.lastAlertAt = null;
      document.getElementById('pressure-' + t.id).classList.remove('low');
      document.getElementById('pressure-' + t.id).value = '';
      document.getElementById('ruckzug-' + t.id).textContent = 'Rückzug';
      document.getElementById('start-' + t.id).disabled = true;
      document.getElementById('ruckmeld-' + t.id).disabled = false;
      document.getElementById('ruckzug-' + t.id).disabled = false;
      document.getElementById('ende-' + t.id).disabled = false;
      document.getElementById('startedAt-' + t.id).textContent = fmtClock(t.startTime);
      addLog(t.name, 'Start', 'Einsatz unter Atemschutz angetreten');
      saveState();
    });

    document.getElementById('ruckmeld-' + t.id).addEventListener('click', () => {
      t.lastCheck = new Date();
      t.alerted = false;
      t.lastAlertAt = null;
      const pInput = document.getElementById('pressure-' + t.id);
      const p = pInput.value;
      t.pressure = p;
      document.getElementById('lastAt-' + t.id).textContent = fmtClock(t.lastCheck);

      const threshold = Number(document.getElementById('pressureThreshold').value) || 0;
      const wasWarning = t.pressureWarning;
      if(p !== '' && Number(p) <= threshold){
        t.pressureWarning = true;
        pInput.classList.add('low');
        if(!t.pressureAlerted){
          t.pressureAlerted = true;
          alertSound();
          addLog(t.name, 'RÜCKZUG – Flaschendruck', p + ' bar ≤ Warnschwelle (' + threshold + ' bar)');
        } else {
          addLog(t.name, 'Rückmeldung', p + ' bar (weiterhin unter Warnschwelle)');
        }
      } else {
        t.pressureWarning = false;
        t.pressureAlerted = false;
        pInput.classList.remove('low');
        addLog(t.name, 'Rückmeldung', p ? (p + ' bar') : '');
      }
      saveState();
    });

    document.getElementById('ruckzug-' + t.id).addEventListener('click', () => {
      t.rueckzugManual = !t.rueckzugManual;
      const btn = document.getElementById('ruckzug-' + t.id);
      btn.textContent = t.rueckzugManual ? 'Rückzug aufheben' : 'Rückzug';
      addLog(t.name, t.rueckzugManual ? 'Rückzug angetreten (manuell)' : 'Rückzug aufgehoben');
      saveState();
    });

    document.getElementById('ende-' + t.id).addEventListener('click', () => {
      t.state = 'ended';
      document.getElementById('ruckmeld-' + t.id).disabled = true;
      document.getElementById('ruckzug-' + t.id).disabled = true;
      document.getElementById('ende-' + t.id).disabled = true;
      addLog(t.name, 'Einsatz beendet');
      t.rueckzugManual = false;
      t.pressureWarning = false;
      t.pressureAlerted = false;
      document.getElementById('ruckzug-' + t.id).textContent = 'Rückzug';
      document.getElementById('pressure-' + t.id).classList.remove('low');
      refreshStartButton();
      saveState();
    });
  }

  function collectState(){
    return {
      einsatzName: document.getElementById('einsatzName').value,
      intervalMin: intervalInput.value,
      warnPct: warnPctInput.value,
      pressureThreshold: document.getElementById('pressureThreshold').value,
      soundOn: soundOn,
      logEntries: logEntries,
      trupps: trupps.map(t => ({
        id: t.id,
        name: t.name,
        state: t.state,
        rueckzugManual: t.rueckzugManual,
        pressureWarning: t.pressureWarning,
        startTime: t.startTime ? t.startTime.toISOString() : null,
        lastCheck: t.lastCheck ? t.lastCheck.toISOString() : null,
        pressure: t.pressure,
        alerted: t.alerted,
        lastAlertAt: t.lastAlertAt ? t.lastAlertAt.toISOString() : null,
        pressureAlerted: t.pressureAlerted,
        members: [1,2,3].map(n => {
          const el = document.getElementById('member-' + t.id + '-' + n);
          return el ? el.value : '';
        }),
        feuerwehr: (() => {
          const el = document.getElementById('feuerwehr-' + t.id);
          return el ? el.value : '';
        })()
      }))
    };
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));
    }catch(e){
      // Speicher nicht verfügbar (z.B. in einer eingebetteten Vorschau) – App läuft trotzdem weiter.
    }
  }

  function restoreState(){
    let raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ return; }
    if(!raw) return;
    let data;
    try{ data = JSON.parse(raw); }catch(e){ return; }
    if(!data) return;

    document.getElementById('einsatzName').value = data.einsatzName || '';
    intervalInput.value = data.intervalMin || 10;
    warnPctInput.value = data.warnPct || 70;
    document.getElementById('pressureThreshold').value = (data.pressureThreshold != null && data.pressureThreshold !== '') ? data.pressureThreshold : 60;
    soundOn = data.soundOn !== false;
    soundToggle.classList.toggle('active', soundOn);
    soundToggle.textContent = soundOn ? '🔊 Ton' : '🔇 Ton';

    logEntries.length = 0;
    (data.logEntries || []).forEach(e => logEntries.push(e));
    renderLog();

    (data.trupps || []).forEach(saved => {
      const t = trupps.find(x => x.id === saved.id);
      if(!t) return;
      t.name = saved.name || t.name;
      t.state = saved.state || 'idle';
      t.rueckzugManual = !!saved.rueckzugManual;
      t.pressureWarning = !!saved.pressureWarning;
      t.startTime = saved.startTime ? new Date(saved.startTime) : null;
      t.lastCheck = saved.lastCheck ? new Date(saved.lastCheck) : null;
      t.pressure = saved.pressure || '';
      t.alerted = !!saved.alerted;
      t.lastAlertAt = saved.lastAlertAt ? new Date(saved.lastAlertAt) : null;
      t.pressureAlerted = !!saved.pressureAlerted;

      const nameEl = document.getElementById('name-' + t.id);
      if(nameEl) nameEl.textContent = t.name;
      const feuerwehrInput = document.getElementById('feuerwehr-' + t.id);
      if(feuerwehrInput) feuerwehrInput.value = saved.feuerwehr || '';
      (saved.members || []).forEach((val, idx) => {
        const el = document.getElementById('member-' + t.id + '-' + (idx + 1));
        if(el) el.value = val || '';
      });
      const pressureInput = document.getElementById('pressure-' + t.id);
      if(pressureInput){
        pressureInput.value = t.pressure;
        pressureInput.classList.toggle('low', !!t.pressureWarning);
      }

      const startBtn = document.getElementById('start-' + t.id);
      const ruckmeldBtn = document.getElementById('ruckmeld-' + t.id);
      const ruckzugBtn = document.getElementById('ruckzug-' + t.id);
      const endeBtn = document.getElementById('ende-' + t.id);

      if(t.state === 'active'){
        startBtn.disabled = true;
        ruckmeldBtn.disabled = false;
        ruckzugBtn.disabled = false;
        endeBtn.disabled = false;
        ruckzugBtn.textContent = t.rueckzugManual ? 'Rückzug aufheben' : 'Rückzug';
        if(t.startTime) document.getElementById('startedAt-' + t.id).textContent = fmtClock(t.startTime);
        if(t.lastCheck) document.getElementById('lastAt-' + t.id).textContent = fmtClock(t.lastCheck);
      } else if(t.state === 'ended'){
        ruckmeldBtn.disabled = true;
        ruckzugBtn.disabled = true;
        endeBtn.disabled = true;
        if(t.startTime) document.getElementById('startedAt-' + t.id).textContent = fmtClock(t.startTime);
        if(t.lastCheck) document.getElementById('lastAt-' + t.id).textContent = fmtClock(t.lastCheck);
      }

      if(t.refreshStartButton) t.refreshStartButton();
    });
  }

  let nextTruppId = 1;

  // Peek at any saved state so the app opens with the same number of Trupps as last time.
  let initialSavedData = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) initialSavedData = JSON.parse(raw);
  }catch(e){}

  const initialIds = (initialSavedData && Array.isArray(initialSavedData.trupps) && initialSavedData.trupps.length)
    ? initialSavedData.trupps.map(x => x.id)
    : [1];

  initialIds.forEach(id => {
    const t = createTrupp(id);
    buildCard(t);
    if(id >= nextTruppId) nextTruppId = id + 1;
  });

  const addTile = document.createElement('div');
  addTile.className = 'card add-tile';
  addTile.id = 'add-tile';
  addTile.innerHTML = '<button class="add-trupp-btn" id="addTruppBtn" type="button" aria-label="Trupp hinzufügen">' +
    '<span class="add-plus">+</span><span class="add-label">Trupp hinzufügen</span></button>';
  grid.appendChild(addTile);
  addTileEl = addTile;

  function addNewTrupp(){
    const id = nextTruppId++;
    const t = createTrupp(id);
    buildCard(t);
    saveState();
  }
  document.getElementById('addTruppBtn').addEventListener('click', addNewTrupp);

  restoreState();

  function tick(){
    const now = new Date();
    clockEl.childNodes[0].nodeValue = fmtClock(now);
    dateLine.textContent = fmtDate(now);

    const intervalSec = Math.max(1, Number(intervalInput.value) || 10) * 60;
    const warnPct = Math.min(95, Math.max(10, Number(warnPctInput.value) || 70)) / 100;

    trupps.forEach(t => {
      const card = document.getElementById('card-' + t.id);
      const badge = document.getElementById('badge-' + t.id);
      const timerEl = document.getElementById('timer-' + t.id);
      const timerLabel = document.getElementById('timerLabel-' + t.id);

      card.classList.remove('ok','warn','danger','rueckzug','ended');

      if(t.state === 'idle'){
        badge.className = 'badge';
        badge.textContent = 'Bereit';
        timerEl.textContent = '--:--';
        timerLabel.textContent = 'nicht gestartet';
        return;
      }
      if(t.state === 'ended'){
        card.classList.add('ended');
        badge.className = 'badge ended';
        badge.textContent = 'Beendet';
        timerLabel.textContent = 'Einsatz beendet';
        return;
      }

      const elapsed = (now - t.lastCheck) / 1000;
      const remaining = intervalSec - elapsed;

      if(t.pressureWarning){
        card.classList.add('rueckzug');
        badge.className = 'badge rueckzug';
        badge.textContent = 'Rückzug (Luft)';
      } else if(t.rueckzugManual){
        card.classList.add('rueckzug');
        badge.className = 'badge rueckzug';
        badge.textContent = 'Rückzug';
      } else if(remaining <= 0){
        card.classList.add('danger');
        badge.className = 'badge danger';
        badge.textContent = 'Abfrage fällig';
        if(!t.lastAlertAt || (now - t.lastAlertAt) >= 60000){
          t.lastAlertAt = now;
          t.alerted = true;
          alertSound();
          saveState();
        }
      } else if(remaining <= intervalSec * (1 - warnPct)){
        card.classList.add('warn');
        badge.className = 'badge warn';
        badge.textContent = 'Bald fällig';
      } else {
        card.classList.add('ok');
        badge.className = 'badge ok';
        badge.textContent = 'OK';
      }

      timerEl.textContent = fmtMMSS(remaining);
      timerLabel.textContent = remaining >= 0 ? 'bis zur Abfrage' : 'überfällig seit';
    });
  }

  setInterval(tick, 1000);
  tick();

  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.classList.toggle('active', soundOn);
    soundToggle.textContent = soundOn ? '🔊 Ton' : '🔇 Ton';
    saveState();
  });

  document.getElementById('einsatzName').addEventListener('change', saveState);
  intervalInput.addEventListener('change', saveState);
  warnPctInput.addEventListener('change', saveState);
  document.getElementById('pressureThreshold').addEventListener('change', saveState);

  resetBtn.addEventListener('click', () => {
    const ok = confirm('Wirklich alle Daten zurücksetzen? Trupps, Namen und das Protokoll werden unwiderruflich gelöscht.');
    if(!ok) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    location.reload();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {
        // Offline-Registrierung fehlgeschlagen (z.B. lokale Dateivorschau) – App funktioniert trotzdem.
      });
    });
  }

  exportBtn.addEventListener('click', () => {
    const einsatz = document.getElementById('einsatzName').value.trim() || 'Ohne Angabe';
    const now = new Date();
    let lines = [];
    lines.push('Einsatzprotokoll Atemschutzüberwachung (FwDV 7)');
    lines.push('Einsatzstelle: ' + einsatz);
    lines.push('Erstellt: ' + fmtDate(now) + ' ' + fmtClock(now));
    lines.push('');
    lines.push('Uhrzeit;Trupp;Ereignis;Detail');
    [...logEntries].reverse().forEach(e => {
      lines.push(e.time + ';' + e.trupp + ';' + e.event + ';' + e.detail);
    });
    const blob = new Blob([lines.join('\n')], {type: 'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Atemschutz_Protokoll_' + now.toISOString().slice(0,19).replace(/[:T]/g,'-') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

})();
</script>
</body>
</html>
